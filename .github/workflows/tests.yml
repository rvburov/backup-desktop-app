name: Tests

# Push в любую ветку и pull request. Push тега сюда не попадает: тег запускает release.yml,
# и там тесты идут на каждой системе перед сборкой.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # В Actions задания называются по системам (Windows, Linux, macOS), а не по меткам машин:
  # name из include добавляется ко всем сочетаниям матрицы с тем же os.
  test:
    name: Тесты ${{ matrix.name }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        include:
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-latest,  name: Linux }
          - { os: macos-latest,   name: macOS }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static check
        run: python -m pyflakes backup_app tests backup-app.py

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m pytest

  # Скрипты выпуска (scripts/github-release) на трех системах: release.sh запускают
  # на любой из них, а sed, awk и bash там разные.
  release-scripts:
    name: Скрипты релиза ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows }
          - { os: ubuntu-latest,  name: Linux }
          - { os: macos-latest,   name: macOS }

    steps:
      - uses: actions/checkout@v7

      - name: Release scripts tests
        shell: bash
        run: bash scripts/github-release/release-test.sh
