; Пример файла настроек приложения резервного копирования.
; Реальный файл создается автоматически в папке настроек пользователя
; (Windows: %LOCALAPPDATA%\BackupApp\settings.ini), путь виден в журнале при запуске.
; Обратные слеши в путях внутри INI нужно удваивать: C:\Users\User\Documents
; или использовать прямые: C:/Users/User/Documents
;
; Общие настройки приложения хранятся в [General]. Расписание и параметры копирования
; у каждой вкладки свои и хранятся в ее секции [Tab_N].
; Файл прежней версии (9.x), где расписание и параметры были общими в [General],
; читается как раньше: каждая вкладка получает эти общие значения.
;
; Значения ниже — значения по умолчанию, как при первом запуске и после сброса:
; все переключатели и параметры копирования выключены.

[General]
; Автозапуск при входе в систему, приложение стартует свернутым в трей (true/false)
auto_start=false

; Сворачивать в трей вместо закрытия окна, работа в фоне (true/false)
minimize_to_tray=false

; Показывать уведомления в трее о начале и результате копирования (true/false)
show_notifications=false

; Выполнять пропущенное копирование при запуске, если компьютер был выключен (true/false)
run_missed=false

; Максимальный размер копируемого файла в ГБ, более крупные пропускаются (0 = без ограничения)
max_file_size_gb=2

; Номер выбранной вкладки, начиная с 0
active_tab=0

; Количество вкладок и их названия
tab_count=1
tab_names=Без названия

; Секции вкладок нумеруются с нуля: [Tab_0], [Tab_1], ...
[Tab_0]
; Постоянный идентификатор вкладки (латинские буквы и цифры). Если его нет
; или он повторяется, приложение создает новый
tab_id=3f2a9c1d7e40

; Заголовок вкладки
tab_title=Без названия

; Папки для копирования (список через запятую; пустой список записывается как @Invalid())
source_folders=@Invalid()

; Отдельные файлы для копирования
source_files=@Invalid()

; Папка назначения для резервных копий
destination_folder=

; Расписание вкладки включено; восстанавливается при следующем запуске (true/false).
; Включает и выключает его само приложение
timer_active=false

; Тип периода копирования: Ежедневно, Еженедельно, Ежемесячно
period_type=Ежедневно

; Время автоматического копирования (формат: чч:мм)
backup_time=09:00

; День недели (0-6): 0=Понедельник, 6=Воскресенье
weekday=0

; День месяца (1-31), обрезается до последнего дня короткого месяца
monthday=1

; Копировать содержимое папок вместо всей папки (true/false)
copy_folder_contents=false

; Создавать папку "Резервное копирование дд-мм-гггг" при каждом копировании (true/false)
create_backup_folder=false

; Добавлять дату к имени копии файла при совпадении имен (true/false)
keep_history=false

; Копировать только новые и измененные файлы (true/false): неизмененные пропускаются,
; прежняя копия измененного файла получает в имени дату своего изменения
copy_only_changed=false

; Служебные отметки времени (ISO 8601), заполняются приложением
timer_started_at=
last_backup_time=

; Пример заполненной вкладки с недельным расписанием:
; [Tab_1]
; tab_id=8b51e0c4a2f7
; tab_title=Мои документы
; source_folders=C:/Users/User/Documents, C:/Users/User/Desktop
; source_files=C:/Users/User/important.txt
; destination_folder=D:/Backup
; timer_active=true
; period_type=Еженедельно
; backup_time=21:30
; weekday=4
; monthday=1
; copy_folder_contents=false
; create_backup_folder=true
; keep_history=true
; copy_only_changed=false
; timer_started_at=
; last_backup_time=
